# =============================================================================
# Docker Compose — Ambiente local Moodle 4.x + PostgreSQL 15
# =============================================================================
# Pré-requisitos: Docker Engine >= 24 e Docker Compose v2
# Uso:
#   cp docker/.env.example docker/.env   # configure as variáveis de ambiente
#   docker compose -f docker/docker-compose.yml up -d
# Acesso: http://localhost:8080
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Serviço: db — Banco de dados PostgreSQL 15
  # TODO: Ajuste a versão da imagem ou parâmetros de memória conforme necessário
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15
    restart: unless-stopped

    # Carrega as variáveis de ambiente a partir do arquivo .env local
    # TODO: Em produção, use o arquivo .env (sem valores de exemplo)
    env_file:
      - .env

    # Healthcheck: aguarda o PostgreSQL aceitar conexões antes de liberar o Moodle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    volumes:
      # TODO: Ajuste o caminho do volume ou use um bind mount externo se necessário
      - db_data:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Serviço: moodle — Aplicação Moodle 4.x (build a partir do Dockerfile local)
  # TODO: Ajuste as variáveis de ambiente ou adicione configurações extras aqui
  # ---------------------------------------------------------------------------
  moodle:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    # Aguarda o PostgreSQL estar saudável antes de iniciar o Moodle
    depends_on:
      db:
        condition: service_healthy

    # TODO: Altere a porta do host (8080) caso ela já esteja em uso na sua máquina
    ports:
      - "8080:80"

    # Carrega as variáveis de ambiente a partir do arquivo .env local
    # TODO: Ajuste as variáveis de ambiente ou adicione configurações extras aqui
    env_file:
      - .env

    # Passa as variáveis de conexão ao banco de dados para o contêiner Moodle
    # As variáveis MOODLE_DB_* são lidas diretamente do .env e repassadas
    # ao entrypoint.sh, que as usa para aguardar o banco e rodar o instalador.
    environment:
      - MOODLE_DB_TYPE=${MOODLE_DB_TYPE}
      - MOODLE_DB_HOST=${MOODLE_DB_HOST}
      - MOODLE_DB_PORT=${MOODLE_DB_PORT}
      - MOODLE_DB_NAME=${MOODLE_DB_NAME}
      - MOODLE_DB_USER=${MOODLE_DB_USER}
      - MOODLE_DB_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_DB_PREFIX=${MOODLE_DB_PREFIX}
      - MOODLE_WWWROOT=${MOODLE_WWWROOT}
      - MOODLE_ADMIN_USER=${MOODLE_ADMIN_USER}
      - MOODLE_ADMIN_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_ADMIN_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME}

    volumes:
      # NOTE: /var/www/html is NOT mounted here — Moodle source files are baked
      # into the image at build time (COPY step in Dockerfile). Mounting a volume
      # there would shadow the installed files and break the installation.
      # TODO: Ajuste o caminho do volume caso necessário
      - moodle_www:/var/moodledata

# =============================================================================
# Volumes nomeados
# TODO: Para persistência externa, substitua por bind mounts ou drivers de volume
# =============================================================================
volumes:
  db_data:
  moodle_www:
