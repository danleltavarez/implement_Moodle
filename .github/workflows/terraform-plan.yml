# =============================================================================
# terraform-plan.yml — Executa terraform plan via GitHub Actions
# =============================================================================
# Acionado manualmente (workflow_dispatch) para gerar o plano de execução
# do Terraform sem aplicar mudanças na AWS.
#
# PRÉ-REQUISITOS — Secrets do repositório (Settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID         → Access Key ID das credenciais temporárias do Learn Lab
#   AWS_SECRET_ACCESS_KEY     → Secret Access Key das credenciais temporárias do Learn Lab
#   AWS_SESSION_TOKEN         → Session Token (obrigatório no Learn Lab — credenciais STS)
#   TF_VAR_ec2_public_key     → Chave pública SSH para o key pair da EC2
#   TF_VAR_db_password        → Senha do banco de dados RDS
#   TF_VAR_moodle_admin_password → Senha do administrador do Moodle
#
# TODO: Configure os secrets acima em Settings → Secrets and variables → Actions
#       antes de disparar este workflow. As credenciais do Learn Lab expiram em
#       ~4 horas — atualize os secrets antes de cada execução.
# =============================================================================

name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      terraform_dir:
        description: "Diretório raiz do Terraform"
        required: false
        default: "terraform"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do repositório para que os arquivos Terraform estejam disponíveis no runner
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Configura as credenciais temporárias do AWS Learn Lab para autenticar o provider Terraform
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Instala o Terraform CLI na versão compatível com versions.tf (>= 1.5)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      # Inicializa o diretório Terraform sem backend remoto (evita erro se bucket S3 não existir)
      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ github.event.inputs.terraform_dir }}

      # Verifica se todos os arquivos .tf estão formatados corretamente
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ github.event.inputs.terraform_dir }}

      # Valida a sintaxe e consistência interna dos arquivos Terraform sem chamar a API AWS
      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ github.event.inputs.terraform_dir }}

      # Gera o plano de execução e salva em tfplan para auditoria
      # As variáveis sensíveis (db_password, ec2_public_key, moodle_admin_password) são injetadas via secrets
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ github.event.inputs.terraform_dir }}
        env:
          TF_VAR_ec2_public_key: ${{ secrets.TF_VAR_ec2_public_key }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
          TF_VAR_moodle_admin_password: ${{ secrets.TF_VAR_moodle_admin_password }}

      # Exibe o resumo legível do plano no log do workflow para revisão
      - name: Exibir resumo do plano
        run: |
          echo "## Terraform Plan" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan >> $GITHUB_STEP_SUMMARY
        working-directory: ${{ github.event.inputs.terraform_dir }}
